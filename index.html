<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дамавік</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#2b2622; --muted:#8a8077; --line:#e7e0d6;
  --a:#e07a5f; --b:#5b8e7d; --both:#9a7fc4; --rot:#d4a24c;
  --warn:#d9534f; --soon:#e0a03a; --ok:#6aa36f; --chip:#efe9e0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262321; --ink:#efe9e2; --muted:#9a9088; --line:#36312d; --chip:#302c29;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262321; --ink:#efe9e2; --muted:#9a9088; --line:#36312d; --chip:#302c29;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:22px;margin:0;flex:1}
.sync{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.spacer{flex:1}
.zone{margin:18px 0 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.task .main{flex:1;min-width:0}
.task .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.due-over{color:var(--warn);font-weight:600}
.due-soon{color:var(--soon);font-weight:600}
.due-ok{color:var(--ok)}
.pill{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.done{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;font-size:17px;flex:none}
.done:hover{border-color:var(--ok);color:var(--ok)}
.done.flash{background:var(--ok);border-color:var(--ok);color:#fff}
.edit{border:0;background:none;color:var(--muted);font-size:18px;padding:4px;flex:none}
.dots{letter-spacing:1px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--chip)}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:width .3s}
.legend{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.log{font-size:13px;max-height:260px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log span:last-child{margin-left:auto;color:var(--muted);white-space:nowrap}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:60px;resize:vertical}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;border:1px solid var(--line);background:var(--bg);padding:7px 9px;border-radius:9px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:10px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.del{color:var(--warn)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
dialog{border:0;border-radius:18px;padding:18px;width:min(460px,calc(100vw - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0;font-size:18px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;gap:8px;align-items:center}
.color input[type=color]{width:38px;height:38px;border:0;background:none;padding:0}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 Дамавік</h1>
    <span class="sync" id="syncState"></span>
  </header>
  <div class="tabs">
    <button data-tab="tasks" class="on">Справы</button>
    <button data-tab="balance">Баланс</button>
    <button data-tab="settings">Налады</button>
  </div>
  <section id="tab-tasks"></section>
  <section id="tab-balance" hidden></section>
  <section id="tab-settings" hidden></section>
</div>
<button class="fab" id="addBtn" title="Дадаць справу">+</button>
<div class="toast" id="toast"></div>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

<script>
const FREQ = {
  daily:{l:'Штодня',days:1,w:7},
  every3:{l:'Раз на 2-3 дні',days:3,w:2.5},
  weekly:{l:'Штотыдзень',days:7,w:1},
  biweekly:{l:'Раз на 2 тыдні',days:14,w:.5},
  monthly:{l:'Штомесяц',days:30,w:.25},
  asneeded:{l:'Па патрэбе',days:0,w:.5}
};
const STORE_KEY='domovik-v1', CFG_KEY='domovik-cfg', GIST_FILE='domovik.json';
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=864e5;

function seed(){
  const t=(title,zone,owner,freq,effort)=>({id:uid(),title,zone,owner,next:'a',freq,effort,lastDone:null,lastBy:null,note:''});
  return {
    people:{a:{name:'Уладзь',color:'#e07a5f'},b:{name:'Яна',color:'#5b8e7d'}},
    zones:['🍳 Кухня','🛁 Ванная','🛋 Пакоі','🧺 Пранне','🛒 Пакупкі і рахункі','🌿 Іншае'],
    tasks:[
      t('Памыць посуд / пасудамыйка','🍳 Кухня','rotate','daily',1),
      t('Выцерці стол і пліту','🍳 Кухня','rotate','daily',1),
      t('Вынесці смецце','🍳 Кухня','a','every3',1),
      t('Разабраць халадзільнік','🍳 Кухня','b','monthly',2),
      t('Памыць ванну і ракавіну','🛁 Ванная','a','weekly',2),
      t('Памыць унітаз','🛁 Ванная','b','weekly',2),
      t('Змяніць ручнікі','🛁 Ванная','b','weekly',1),
      t('Пыласос','🛋 Пакоі','a','weekly',2),
      t('Памыць падлогу','🛋 Пакоі','rotate','biweekly',3),
      t('Выцерці пыл','🛋 Пакоі','b','biweekly',1),
      t('Змяніць пасцельную бялізну','🛋 Пакоі','both','biweekly',2),
      t('Запусціць пральку','🧺 Пранне','b','weekly',1),
      t('Развесіць і скласці бялізну','🧺 Пранне','a','weekly',2),
      t('Закупка прадуктаў','🛒 Пакупкі і рахункі','both','weekly',2),
      t('Аплаціць рахункі','🛒 Пакупкі і рахункі','a','monthly',1),
      t('Паліць кветкі','🌿 Іншае','b','every3',1)
    ],
    log:[],
    updated:Date.now()
  };
}

const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=ls.get(STORE_KEY)||seed();
let C=Object.assign({me:'a',token:'',gist:'',theme:'auto'},ls.get(CFG_KEY)||{});
let UI={tab:'tasks',filter:'all',group:'zone'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function applyTheme(){document.documentElement.dataset.theme=C.theme==='auto'?'':C.theme}

function ownerInfo(o,task){
  const P=S.people;
  if(o==='a'||o==='b')return{label:P[o].name,color:P[o].color};
  if(o==='both')return{label:'Разам',color:'var(--both)'};
  return{label:'🔄 '+P[task?.next||'a'].name,color:'var(--rot)'};
}
function dueInfo(t){
  const f=FREQ[t.freq];
  if(!f.days)return{txt:t.lastDone?'апошні раз '+ago(t.lastDone):'па патрэбе',cls:'',score:9999};
  if(!t.lastDone)return{txt:'яшчэ не рабілі',cls:'due-soon',score:-1};
  const left=Math.round((t.lastDone+f.days*DAY-Date.now())/DAY);
  if(left<0)return{txt:'пратэрмінавана '+(-left)+' дн.',cls:'due-over',score:left};
  if(left===0)return{txt:'сёння',cls:'due-soon',score:0};
  if(left===1)return{txt:'заўтра',cls:'due-soon',score:1};
  return{txt:'праз '+left+' дн.',cls:'due-ok',score:left};
}
function ago(ts){const d=Math.floor((Date.now()-ts)/DAY);return d<=0?'сёння':d===1?'учора':d+' дн. таму'}

function save(){S.updated=Date.now();ls.set(STORE_KEY,S);scheduleSync();render()}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  ['tasks','balance','settings'].forEach(k=>$('#tab-'+k).hidden=UI.tab!==k);
  $('#addBtn').hidden=UI.tab!=='tasks';
  if(UI.tab==='tasks')renderTasks();
  if(UI.tab==='balance')renderBalance();
  if(UI.tab==='settings')renderSettings();
}

function taskHTML(t){
  const o=ownerInfo(t.owner,t), d=dueInfo(t);
  return `<div class="task">
    <button class="done" data-done="${t.id}" title="Зроблена">✓</button>
    <div class="main">
      <div class="t">${esc(t.title)}</div>
      <div class="meta"><span class="${d.cls}">${d.txt}</span><span>${FREQ[t.freq].l}</span><span class="dots">${'●'.repeat(t.effort)}${'○'.repeat(3-t.effort)}</span>${UI.group==='due'?`<span>${esc(t.zone)}</span>`:''}</div>
    </div>
    <button class="pill" style="background:${o.color}" data-cycle="${t.id}" title="Змяніць адказнага">${esc(o.label)}</button>
    <button class="edit" data-edit="${t.id}" title="Рэдагаваць">⋯</button>
  </div>`;
}

function renderTasks(){
  const P=S.people;
  const filters=[['all','Усе'],['a',P.a.name],['b',P.b.name],['both','Разам'],['rotate','Па чарзе'],['due','🔥 Трэба зрабіць']];
  let list=S.tasks.filter(t=>{
    if(UI.filter==='all')return true;
    if(UI.filter==='due'){const s=dueInfo(t).score;return s<=1}
    if(UI.filter==='a'||UI.filter==='b')return t.owner===UI.filter||t.owner==='both'||(t.owner==='rotate'&&t.next===UI.filter);
    return t.owner===UI.filter;
  });
  let body='';
  if(!list.length)body='<div class="empty">Тут пуста. Можна адпачыць 🙂</div>';
  else if(UI.group==='zone'){
    const zones=[...S.zones,...new Set(list.map(t=>t.zone).filter(z=>!S.zones.includes(z)))];
    zones.forEach(z=>{const ts=list.filter(t=>t.zone===z);if(ts.length)body+=`<div class="zone">${esc(z)}</div>`+ts.map(taskHTML).join('')});
  } else {
    body=list.slice().sort((x,y)=>dueInfo(x).score-dueInfo(y).score).map(taskHTML).join('');
  }
  $('#tab-tasks').innerHTML=`
    <div class="row">${filters.map(([k,l])=>`<button class="chip ${UI.filter===k?'on':''}" data-filter="${k}">${esc(l)}</button>`).join('')}</div>
    <div class="row"><span class="spacer"></span>
      <button class="chip ${UI.group==='zone'?'on':''}" data-group="zone">Па зонах</button>
      <button class="chip ${UI.group==='due'?'on':''}" data-group="due">Па тэрміне</button>
    </div>${body}`;
}

function load(){
  const L={a:0,b:0};
  S.tasks.forEach(t=>{const w=FREQ[t.freq].w*t.effort;if(t.owner==='a'||t.owner==='b')L[t.owner]+=w;else{L.a+=w/2;L.b+=w/2}});
  return L;
}
function bar(a,b){
  const P=S.people,tot=a+b||1,pa=Math.round(a/tot*100);
  return `<div class="bar"><div style="width:${pa}%;background:${P.a.color}">${pa}%</div><div style="width:${100-pa}%;background:${P.b.color}">${100-pa}%</div></div>
  <div class="legend"><span>${esc(P.a.name)}</span><span>${esc(P.b.name)}</span></div>`;
}
function renderBalance(){
  const P=S.people,L=load();
  const since=Date.now()-7*DAY, since30=Date.now()-30*DAY;
  const cnt=(from)=>{const c={a:0,b:0};S.log.filter(e=>e.ts>=from).forEach(e=>{const t=S.tasks.find(x=>x.id===e.taskId);c[e.by]+=t?t.effort:1});return c};
  const w=cnt(since),m=cnt(since30);
  const own=k=>S.tasks.filter(t=>t.owner===k).length;
  $('#tab-balance').innerHTML=`
    <div class="card"><h3>Плануемая нагрузка</h3>${bar(L.a,L.b)}
      <div class="hint">Лічыцца як частата × цяжкасць. "Разам" і "па чарзе" дзеляцца напалову. Сваіх спраў: ${esc(P.a.name)} ${own('a')}, ${esc(P.b.name)} ${own('b')}, агульных ${own('both')+own('rotate')}.</div></div>
    <div class="card"><h3>Рэальна зроблена за 7 дзён</h3>${w.a+w.b?bar(w.a,w.b):'<div class="hint">Пакуль нічога не адзначана.</div>'}</div>
    <div class="card"><h3>За 30 дзён</h3>${m.a+m.b?bar(m.a,m.b):'<div class="hint">Пакуль нічога не адзначана.</div>'}</div>
    <div class="card"><h3>Гісторыя</h3><div class="log">${S.log.slice().reverse().slice(0,60).map(e=>{
      const t=S.tasks.find(x=>x.id===e.taskId);
      return `<div><span style="color:${P[e.by].color};font-weight:600">${esc(P[e.by].name)}</span><span>${esc(t?t.title:'(выдалена)')}</span><span>${new Date(e.ts).toLocaleDateString('be',{day:'numeric',month:'short'})}</span></div>`}).join('')||'<div class="hint">Пуста</div>'}</div></div>`;
}

function renderSettings(){
  const P=S.people;
  $('#tab-settings').innerHTML=`
    <div class="card"><h3>Мы</h3>
      <div class="people">${['a','b'].map(k=>`<div><div class="color"><input type="color" value="${P[k].color}" data-pcolor="${k}"><input type="text" value="${esc(P[k].name)}" data-pname="${k}"></div></div>`).join('')}</div>
      <label class="f">Хто карыстаецца гэтай прыладай (каму залічваць ✓)</label>
      <div class="seg">${['a','b'].map(k=>`<button type="button" class="${C.me===k?'on':''}" data-me="${k}">${esc(P[k].name)}</button>`).join('')}</div>
    </div>
    <div class="card"><h3>Зоны</h3>
      <textarea id="zones" rows="6">${esc(S.zones.join('\n'))}</textarea>
      <div class="hint">Адна зона на радок, эмодзі на пачатку па жаданні.</div>
      <div class="btns"><button class="btn" id="saveZones">Захаваць зоны</button></div>
    </div>
    <div class="card"><h3>Сінхранізацыя праз GitHub Gist</h3>
      <label class="f">GitHub token (толькі права gist)</label>
      <input type="password" id="token" value="${esc(C.token)}" placeholder="ghp_...">
      <label class="f">Gist ID</label>
      <input type="text" id="gist" value="${esc(C.gist)}" placeholder="пуста = стварыць новы">
      <div class="btns">
        <button class="btn pri" id="gistSave">${C.gist?'Захаваць у gist':'Стварыць gist'}</button>
        <button class="btn" id="gistLoad" ${C.gist?'':'disabled'}>Загрузіць з gist</button>
      </div>
      <div class="hint">Пасля налады змены захоўваюцца аўтаматычна, а пры адкрыцці старонка падцягвае свежую версію. Другі чалавек уводзіць той жа token і Gist ID.</div>
    </div>
    <div class="card"><h3>Іншае</h3>
      <label class="f">Тэма</label>
      <div class="seg">${[['auto','Аўта'],['light','Светлая'],['dark','Цёмная']].map(([k,l])=>`<button type="button" class="${C.theme===k?'on':''}" data-theme-set="${k}">${l}</button>`).join('')}</div>
      <div class="btns">
        <button class="btn" id="exp">Экспарт JSON</button>
        <button class="btn" id="imp">Імпарт JSON</button>
        <button class="btn del" id="reset">Скінуць усё</button>
      </div>
    </div>`;
}

/* ---------- task dialog ---------- */
function openTask(id){
  const P=S.people;
  const t=id?S.tasks.find(x=>x.id===id):{title:'',zone:S.zones[0]||'',owner:C.me,freq:'weekly',effort:1,note:''};
  const st={owner:t.owner,freq:t.freq,effort:t.effort};
  const f=$('#form');
  const seg=(name,opts,val)=>`<div class="seg" data-seg="${name}">${opts.map(([k,l])=>`<button type="button" data-v="${k}" class="${String(val)===String(k)?'on':''}">${esc(l)}</button>`).join('')}</div>`;
  f.innerHTML=`<h2>${id?'Рэдагаваць':'Новая справа'}</h2>
    <label class="f">Што трэба рабіць</label><input type="text" name="title" value="${esc(t.title)}" required placeholder="Напр. памыць вокны">
    <label class="f">Зона</label><select name="zone">${S.zones.map(z=>`<option ${z===t.zone?'selected':''}>${esc(z)}</option>`).join('')}</select>
    <label class="f">Хто адказвае</label>${seg('owner',[['a',P.a.name],['b',P.b.name],['both','Разам'],['rotate','Па чарзе']],st.owner)}
    <label class="f">Як часта</label>${seg('freq',Object.entries(FREQ).map(([k,v])=>[k,v.l]),st.freq)}
    <label class="f">Наколькі цяжка</label>${seg('effort',[[1,'● Лёгка'],[2,'●● Сярэдне'],[3,'●●● Цяжка']],st.effort)}
    <label class="f">Нататка</label><textarea name="note" placeholder="Па жаданні">${esc(t.note)}</textarea>
    <div class="btns">${id?'<button type="button" class="btn del" id="delTask">Выдаліць</button>':''}<span class="spacer"></span>
      <button type="button" class="btn" id="cancel">Адмена</button><button class="btn pri" value="ok">Захаваць</button></div>`;
  f.querySelectorAll('[data-seg]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');st[g.dataset.seg]=g.dataset.seg==='effort'?+b.dataset.v:b.dataset.v});
  $('#cancel').onclick=()=>$('#dlg').close();
  if(id)$('#delTask').onclick=()=>{if(confirm('Выдаліць справу?')){S.tasks=S.tasks.filter(x=>x.id!==id);$('#dlg').close();save()}};
  f.onsubmit=e=>{
    const fd=new FormData(f);const title=fd.get('title').trim();if(!title){e.preventDefault();return}
    const data={title,zone:fd.get('zone'),note:fd.get('note').trim(),...st};
    if(id)Object.assign(t,data);else S.tasks.push({id:uid(),next:C.me,lastDone:null,lastBy:null,...data});
    save();
  };
  $('#dlg').showModal();
}

/* ---------- actions ---------- */
function markDone(id,btn){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const by=C.me;
  t.lastDone=Date.now();t.lastBy=by;
  if(t.owner==='rotate')t.next=by==='a'?'b':'a';
  S.log.push({taskId:id,by,ts:t.lastDone});
  if(S.log.length>500)S.log=S.log.slice(-500);
  btn.classList.add('flash');
  toast('Малайчына, '+S.people[by].name+'!');
  setTimeout(save,350);
}
function cycleOwner(id){
  const order=['a','b','both','rotate'];const t=S.tasks.find(x=>x.id===id);
  t.owner=order[(order.indexOf(t.owner)+1)%order.length];save();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){UI.tab=d.tab;render()}
  else if(d.filter){UI.filter=d.filter;render()}
  else if(d.group){UI.group=d.group;render()}
  else if(d.done)markDone(d.done,b);
  else if(d.cycle)cycleOwner(d.cycle);
  else if(d.edit)openTask(d.edit);
  else if(d.me){C.me=d.me;ls.set(CFG_KEY,C);render()}
  else if(d.themeSet){C.theme=d.themeSet;ls.set(CFG_KEY,C);applyTheme();render()}
  else if(b.id==='addBtn')openTask(null);
  else if(b.id==='saveZones'){S.zones=$('#zones').value.split('\n').map(s=>s.trim()).filter(Boolean);save();toast('Зоны захаваныя')}
  else if(b.id==='gistSave'){readGistCfg();pushGist(true)}
  else if(b.id==='gistLoad'){readGistCfg();pullGist(true)}
  else if(b.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='domovik.json';a.click()}
  else if(b.id==='imp'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(d.tasks){S=d;save();toast('Імпартавана')}}catch(err){toast('Не атрымалася прачытаць файл')}};i.click()}
  else if(b.id==='reset'){if(confirm('Скінуць усе справы і гісторыю да пачатковых?')){S=seed();save()}}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.pname){S.people[d.pname].name=e.target.value.trim()||S.people[d.pname].name;save()}
  if(d.pcolor){S.people[d.pcolor].color=e.target.value;save()}
});

/* ---------- gist sync ---------- */
function readGistCfg(){C.token=$('#token').value.trim();C.gist=$('#gist').value.trim();ls.set(CFG_KEY,C)}
function setSync(t){$('#syncState').textContent=t}
const gh=(path,opt={})=>fetch('https://api.github.com'+path,{...opt,headers:{'Authorization':'Bearer '+C.token,'Accept':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});
let syncT=null;
function scheduleSync(){if(!C.token||!C.gist)return;clearTimeout(syncT);setSync('…');syncT=setTimeout(()=>pushGist(false),1500)}
async function pushGist(manual){
  if(!C.token){toast('Увядзі token');return}
  try{
    const body=JSON.stringify({description:'Дамавік: хатнія справы',public:false,files:{[GIST_FILE]:{content:JSON.stringify(S)}}});
    const r=C.gist?await gh('/gists/'+C.gist,{method:'PATCH',body}):await gh('/gists',{method:'POST',body});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(!C.gist){C.gist=j.id;ls.set(CFG_KEY,C);if(UI.tab==='settings')render()}
    setSync('✓ сінхранізавана');if(manual)toast('Захавана ў gist');
  }catch(err){setSync('⚠ няма сінхры');if(manual)toast('Памылка gist: '+err.message)}
}
async function pullGist(manual){
  if(!C.token||!C.gist)return;
  try{
    setSync('…');
    const r=await gh('/gists/'+C.gist+'?t='+Date.now());if(!r.ok)throw new Error(r.status);
    const j=await r.json();const f=j.files[GIST_FILE];if(!f)throw new Error('няма файла');
    const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;
    const d=JSON.parse(txt);
    if(manual||!S.updated||d.updated>=S.updated){S=d;ls.set(STORE_KEY,S);render()}
    else pushGist(false);
    setSync('✓ сінхранізавана');if(manual)toast('Загружана');
  }catch(err){setSync('⚠ няма сінхры');if(manual)toast('Памылка gist: '+err.message)}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullGist(false)});

applyTheme();render();pullGist(false);
setInterval(render,60000);
</script>
</body>
