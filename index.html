<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Напалам</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#2b2622;--muted:#8a8077;--line:#e7e0d6;--chip:#efe9e0;--a:#e07a5f;--b:#5b8e7d}
@media (prefers-color-scheme: dark){:root{--bg:#1c1a18;--card:#262321;--ink:#efe9e2;--muted:#9a9088;--line:#36312d;--chip:#302c29}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:22px;margin:0;flex:1}
.sync{font-size:12px;color:var(--muted)}
.icon{border:0;background:var(--chip);border-radius:10px;width:36px;height:36px;font-size:17px;cursor:pointer}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.col{min-width:0;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;min-height:200px;transition:border-color .15s,background .15s}
.col.over{border-color:var(--c)}
.head{display:flex;align-items:center;gap:6px;margin-bottom:8px;border-bottom:3px solid var(--c);padding-bottom:6px}
.head input{border:0;background:none;font-weight:700;font-size:16px;width:100%;min-width:0;padding:2px;color:var(--c)}
.head input:focus{outline:2px solid var(--line);border-radius:6px}
.head span{color:var(--muted);font-size:13px}
.list{min-height:40px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 6px 8px 10px;cursor:grab;user-select:none;touch-action:none;font-size:14px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .x{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px;opacity:.6}
.item .x:hover{opacity:1}
.item.dragging{opacity:.3}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-2deg)}
.placeholder{height:4px;border-radius:2px;background:var(--c)}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;min-width:0;border:1px dashed var(--line);background:none;border-radius:10px;padding:7px 9px;font-size:14px}
.add input:focus{outline:none;border-style:solid;border-color:var(--c)}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
dialog{border:0;border-radius:16px;padding:18px;width:min(420px,calc(100vw - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 6px;font-size:17px}
dialog label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
dialog input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:10px;cursor:pointer}
.btn.on,.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.status{font-size:13px;margin-top:10px;min-height:1em}.status.ok{color:var(--b)}.status.bad{color:#d9534f}
.paper{margin:28px 0 24px;background:#fffef8;color:#2b2622;border:1px solid #e3dccb;border-radius:4px;padding:26px 22px;box-shadow:0 2px 14px rgba(0,0,0,.07);font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.5}
.paper h2{text-align:center;font-size:17px;letter-spacing:.06em;margin:0}
.paper .sub{text-align:center;font-style:italic;margin:2px 0 14px}
.paper .meta{display:flex;justify-content:space-between;font-size:13px;color:#6d655c;margin-bottom:14px}
.paper p{margin:8px 0}
.paper ol{margin:4px 0 4px 6px;padding-left:18px}
.paper .none{color:#9a9088;font-style:italic}
.paper input.term{font:inherit;border:0;border-bottom:1px dashed #a49a8c;background:none;color:inherit;padding:0 2px;width:15em;max-width:100%}
.paper input.term:focus{outline:none;border-bottom-style:solid}
.sigs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px}
.sig .lbl{font-size:12px;color:#6d655c;margin-top:4px}
.sig canvas,.sig img{display:block;width:100%;height:90px;border-bottom:1.5px solid #2b2622;touch-action:none;cursor:crosshair}
.sig canvas{background:repeating-linear-gradient(transparent 0 88px,transparent 88px)}
.sig .row{display:flex;justify-content:space-between;align-items:center}
.sig button{border:0;background:none;color:#9a9088;font:12px system-ui;cursor:pointer;padding:2px}
.stamp{text-align:center;font-size:12px;color:#b04a3a;margin-top:12px;font-family:system-ui;letter-spacing:.04em}
@media (prefers-color-scheme: dark){.paper{filter:brightness(.92)}}
.small{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 <span id="appName"></span></h1>
    <span class="sync" id="syncState"></span>
    <button class="icon" id="cfgBtn">⚙️</button>
  </header>
  <div class="cols" id="cols"></div>
  <div class="hint" id="hint"></div>
  <div class="paper" id="contract"></div>
</div>

<dialog id="cfg"><form method="dialog" id="cfgForm"></form></dialog>

<script>
const I18N={
 be:{app:'Напалам',hint:'Перацягвай справы паміж спісамі. Націсні на імя, каб змяніць.',addPh:'+ дадаць справу',settings:'Налады',lang:'Мова',
   tokenLbl:'GitHub token (толькі права gist)',gistPh:'пуста = стварыць новы',save:'Захаваць у gist',create:'Стварыць gist',load:'Загрузіць з gist',close:'Закрыць',
   needToken:'Спачатку ўвядзі token',needGist:'Увядзі Gist ID або націсні «Стварыць gist»',busy:'Чакай…',created:'✓ Gist створаны',saved:'✓ Захавана',loaded:'✓ Загружана',err:'Памылка',badToken:'Токен не падышоў (401). Правер, што ў яго ёсць права gist',notFound:'Gist не знойдзены (404). Правер ID',offline:'Няма сувязі з GitHub',
   syncHint:'Каб бачыць адны і тыя ж спісы на двух тэлефонах, увядзіце той жа token і Gist ID.',synced:'✓',noSync:'⚠ няма сінхры',
   seedA:['Вынесці смецце','Пыласос','Памыць ванну','Аплаціць рахункі','Развесіць бялізну'],
   seedB:['Памыць посуд','Выцерці пыл','Запусціць пральку','Паліць кветкі','Закупка прадуктаў'],nameB:'Світланка',
   c:{title:'ДАМОВА № 1',sub:'аб справядлівым падзеле хатніх абавязкаў',city:'г. Прага',
    pre:'{A}, далей «Бок 1», і {B}, далей «Бок 2», знаходзячыся ў здаровым розуме і нармальным настроі, дамовіліся пра наступнае:',
    p1:'<b>1. Прадмет.</b> Бакі падтрымліваюць дом у стане, калі не сорамна раптоўна запрасіць госця. Ці маму.',
    p2:'<b>2. Бок 1 ({A}) абавязаны:</b>',p3:'<b>3. Бок 2 ({B}) абавязана:</b>',empty:'нічога (падазрона)',
    p4:'<b>4. Адказнасць.</b> За кожны невыкананы абавязак вінаваты Бок адбывае пакаранне:',pA:'Бок 1:',pB:'Бок 2:',tbd:'яшчэ прыдумваецца…',
    p5:'<b>5. Форс-мажор:</b> хвароба, камандзіроўка, дэдлайн і серыял, які нельга спыніць на сярэдзіне. Апошняе працуе не часцей за раз на тыдзень.',
    p6:'<b>6. Спрэчкі</b> вырашаюцца перамовамі, абдымкамі або падкідваннем манеткі.',
    p7:'<b>7.</b> Перацягванне справы ў іншы спіс лічыцца дадаткам да Дамовы і падпісваецца аўтаматычна.',
    sign:'Подпіс',clear:'сцерці',signHere:'распішыся тут пальцам ці мышкай',stamp:'⚖ ДАМОВА ПАДПІСАНА АБОДВУМА БАКАМІ ⚖'}},
 uk:{app:'Напалам',hint:'Перетягуй справи між списками. Натисни на ім\'я, щоб змінити.',addPh:'+ додати справу',settings:'Налаштування',lang:'Мова',
   tokenLbl:'GitHub token (лише право gist)',gistPh:'порожньо = створити новий',save:'Зберегти в gist',create:'Створити gist',load:'Завантажити з gist',close:'Закрити',
   needToken:'Спочатку введи token',needGist:'Введи Gist ID або натисни «Створити gist»',busy:'Зачекай…',created:'✓ Gist створено',saved:'✓ Збережено',loaded:'✓ Завантажено',err:'Помилка',badToken:'Токен не підійшов (401). Перевір, що в нього є право gist',notFound:'Gist не знайдено (404). Перевір ID',offline:'Немає звʼязку з GitHub',
   syncHint:'Щоб бачити ті самі списки на двох телефонах, введіть той самий token і Gist ID.',synced:'✓',noSync:'⚠ немає синхронізації',
   seedA:['Винести сміття','Пилосос','Помити ванну','Оплатити рахунки','Розвісити білизну'],
   seedB:['Помити посуд','Витерти пил','Запустити пральку','Полити квіти','Закупівля продуктів'],nameB:'Світланка',
   c:{title:'ДОГОВІР № 1',sub:'про справедливий поділ хатніх обовʼязків',city:'м. Прага',
    pre:'{A}, далі «Сторона 1», і {B}, далі «Сторона 2», перебуваючи при здоровому глузді й нормальному настрої, домовилися про таке:',
    p1:'<b>1. Предмет.</b> Сторони підтримують дім у стані, коли не соромно раптово запросити гостя. Або маму.',
    p2:'<b>2. Сторона 1 ({A}) зобовʼязана:</b>',p3:'<b>3. Сторона 2 ({B}) зобовʼязана:</b>',empty:'нічого (підозріло)',
    p4:'<b>4. Відповідальність.</b> За кожен невиконаний обовʼязок винна Сторона відбуває покарання:',pA:'Сторона 1:',pB:'Сторона 2:',tbd:'ще вигадується…',
    p5:'<b>5. Форс-мажор:</b> хвороба, відрядження, дедлайн і серіал, який не можна зупинити на середині. Останнє діє не частіше ніж раз на тиждень.',
    p6:'<b>6. Суперечки</b> вирішуються переговорами, обіймами або підкиданням монетки.',
    p7:'<b>7.</b> Перетягування справи в інший список вважається додатком до Договору й підписується автоматично.',
    sign:'Підпис',clear:'стерти',signHere:'розпишись тут пальцем чи мишкою',stamp:'⚖ ДОГОВІР ПІДПИСАНО ОБОМА СТОРОНАМИ ⚖'}}
};
const KEY='domovik-v2',CFG='domovik-cfg',FILE='domovik.json';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let C=Object.assign({token:'',gist:'',lang:(navigator.language||'').startsWith('uk')?'uk':'be'},ls.get(CFG)||{});
const T=k=>I18N[C.lang][k];
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function seed(){return{names:{a:'Уладзь',b:T('nameB')},a:T('seedA').map(t=>({id:uid(),t})),b:T('seedB').map(t=>({id:uid(),t})),updated:Date.now()}}
/* accept data from the old, bigger version too */
function normalize(d){
  if(d&&Array.isArray(d.a)&&Array.isArray(d.b))return d;
  if(d&&Array.isArray(d.tasks)){
    const n={names:{a:d.people?.a?.name||'Уладзь',b:d.people?.b?.name||T('nameB')},a:[],b:[],updated:d.updated||Date.now()};
    d.tasks.forEach(x=>{const k=x.owner==='a'||x.owner==='b'?x.owner:(n.a.length<=n.b.length?'a':'b');n[k].push({id:x.id||uid(),t:x.title})});
    return n;
  }
  return seed();
}
function ensure(d){d.sig=d.sig||{};d.terms=d.terms||{a:'20 анжуманяў',b:''};return d}
let S=ensure(normalize(ls.get(KEY)));

function save(){S.updated=Date.now();ls.set(KEY,S);render();scheduleSync()}

function render(){
  document.documentElement.lang=C.lang;document.title=T('app');$('#appName').textContent=T('app');$('#hint').textContent=T('hint');
  $('#cols').innerHTML=['a','b'].map(k=>`
    <div class="col" data-k="${k}" style="--c:var(--${k})">
      <div class="head"><input data-name="${k}" value="${esc(S.names[k])}" aria-label="name"><span>${S[k].length}</span></div>
      <div class="list">${S[k].map(it=>`<div class="item" data-id="${it.id}"><span class="t">${esc(it.t)}</span><button class="x" data-del="${it.id}" aria-label="delete">×</button></div>`).join('')}</div>
      <form class="add" data-add="${k}"><input name="q" placeholder="${T('addPh')}" autocomplete="off"></form>
    </div>`).join('');
  renderContract();
}
function renderContract(){
  const c=T('c'),A=esc(S.names.a),B=esc(S.names.b),fill=x=>x.replace(/\{A\}/g,A).replace(/\{B\}/g,B);
  const list=k=>S[k].length?`<ol>${S[k].map(i=>`<li>${esc(i.t)}</li>`).join('')}</ol>`:`<p class="none">${c.empty}</p>`;
  const dates=['a','b'].map(k=>S.sig[k]?.at).filter(Boolean);
  const M={be:['студзеня','лютага','сакавіка','красавіка','мая','чэрвеня','ліпеня','жніўня','верасня','кастрычніка','лістапада','снежня'],uk:['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня']}[C.lang];
  const dt=new Date(dates.length?Math.min(...dates):Date.now()),d=`${dt.getDate()} ${M[dt.getMonth()]} ${dt.getFullYear()}`;
  const short=t=>{const x=new Date(t);return [x.getDate(),x.getMonth()+1].map(n=>String(n).padStart(2,'0')).join('.')+'.'+x.getFullYear()};
  const sig=k=>`<div class="sig">${S.sig[k]?.img?`<img src="${S.sig[k].img}" alt="">`:`<canvas data-sig="${k}" title="${c.signHere}"></canvas>`}
      <div class="row"><span class="lbl">${c.sign}: ${k==='a'?A:B}${S.sig[k]?.at?' · '+short(S.sig[k].at):''}</span>
      ${S.sig[k]?.img?`<button data-unsign="${k}">${c.clear}</button>`:`<span class="lbl">✍</span>`}</div></div>`;
  $('#contract').innerHTML=`<h2>${c.title}</h2><div class="sub">${c.sub}</div>
    <div class="meta"><span>${c.city}</span><span>${d}</span></div>
    <p>${fill(c.pre)}</p><p>${c.p1}</p>
    <p>${fill(c.p2)}</p>${list('a')}<p>${fill(c.p3)}</p>${list('b')}
    <p>${c.p4}<br>${c.pA} <input class="term" data-term="a" value="${esc(S.terms.a)}"><br>${c.pB} <input class="term" data-term="b" value="${esc(S.terms.b)}" placeholder="${c.tbd}"></p>
    <p>${c.p5}</p><p>${c.p6}</p><p>${c.p7}</p>
    <div class="sigs">${sig('a')}${sig('b')}</div>
    ${S.sig.a?.img&&S.sig.b?.img?`<div class="stamp">${c.stamp}</div>`:''}`;
  document.querySelectorAll('canvas[data-sig]').forEach(setupPad);
}
function setupPad(cv){
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#1f3a8a';
  let drawing=false,inked=false,last;
  const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{e.preventDefault();clearTimeout(cv._t);cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p;inked=true};
  cv.onpointerup=cv.onpointercancel=()=>{if(!drawing)return;drawing=false;if(!inked)return;
    clearTimeout(cv._t);cv._t=setTimeout(()=>{S.sig[cv.dataset.sig]={img:cv.toDataURL('image/png'),at:Date.now()};save()},900)};
}

/* edits */
document.addEventListener('submit',e=>{
  const k=e.target.dataset.add;if(!k)return;e.preventDefault();
  const v=e.target.q.value.trim();if(!v)return;
  S[k].push({id:uid(),t:v});save();$(`[data-add="${k}"] input`).focus();
});
document.addEventListener('change',e=>{const k=e.target.dataset.name;if(k){S.names[k]=e.target.value.trim()||S.names[k];save()}
  const t=e.target.dataset.term;if(t){S.terms[t]=e.target.value.trim();save()}});
document.addEventListener('click',e=>{const k=e.target.dataset.unsign;if(k){delete S.sig[k];save()}});
document.addEventListener('click',e=>{
  const id=e.target.dataset.del;if(!id)return;
  ['a','b'].forEach(k=>S[k]=S[k].filter(x=>x.id!==id));save();
});

/* drag (mouse + touch) */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const it=e.target.closest('.item');if(!it||e.target.closest('.x')||e.button>0)return;
  e.preventDefault();
  drag={id:it.dataset.id,el:it,x:e.clientX,y:e.clientY,moved:false};
  it.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.moved=true;const r=drag.el.getBoundingClientRect();
    drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;
    drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.style.width=r.width+'px';
    drag.ghost.style.setProperty('--c',getComputedStyle(drag.el).getPropertyValue('--c'));
    document.body.appendChild(drag.ghost);drag.el.classList.add('dragging');
    drag.ph=document.createElement('div');drag.ph.className='placeholder';
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  if(e.clientY<60)scrollBy(0,-10);else if(e.clientY>innerHeight-60)scrollBy(0,10);
  const col=document.elementFromPoint(e.clientX,e.clientY)?.closest('.col');
  document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over'));
  if(!col){drag.ph.remove();drag.to=null;return}
  col.classList.add('over');
  const list=col.querySelector('.list');
  const items=[...list.querySelectorAll('.item:not(.dragging)')];
  const before=items.find(i=>{const r=i.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  before?list.insertBefore(drag.ph,before):list.appendChild(drag.ph);
  drag.to={k:col.dataset.k,beforeId:before?.dataset.id||null};
});
function endDrag(cancel){
  if(!drag)return;const d=drag;drag=null;
  d.ghost?.remove();d.ph?.remove();d.el.classList.remove('dragging');
  document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'));
  if(cancel||!d.moved||!d.to)return;
  let item;['a','b'].forEach(k=>{const i=S[k].findIndex(x=>x.id===d.id);if(i>-1)item=S[k].splice(i,1)[0]});
  const L=S[d.to.k],i=d.to.beforeId?L.findIndex(x=>x.id===d.to.beforeId):-1;
  i>-1?L.splice(i,0,item):L.push(item);
  save();
}
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));

/* settings: language + gist sync */
$('#cfgBtn').onclick=()=>{
  $('#cfgForm').innerHTML=`<h2>${T('settings')}</h2>
    <label>${T('lang')}</label>
    <div class="seg"><button type="button" class="btn ${C.lang==='be'?'on':''}" data-lang="be">Беларуская</button><button type="button" class="btn ${C.lang==='uk'?'on':''}" data-lang="uk">Українська</button></div>
    <label>${T('tokenLbl')}</label><input type="password" id="token" value="${esc(C.token)}" placeholder="ghp_...">
    <label>Gist ID</label><input id="gist" value="${esc(C.gist)}" placeholder="${T('gistPh')}">
    <div class="btns"><button type="button" class="btn pri" id="push">${C.gist?T('save'):T('create')}</button><button type="button" class="btn" id="pull">${T('load')}</button><button class="btn">${T('close')}</button></div>
    <div class="status" id="cfgStatus"></div>
    <div class="small">${T('syncHint')}</div>`;
  $('#cfgForm').querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{C.lang=b.dataset.lang;ls.set(CFG,C);render();$('#cfg').close();$('#cfgBtn').click()});
  const read=()=>{C.token=$('#token').value.trim();C.gist=$('#gist').value.trim();ls.set(CFG,C)};
  const st=(m,ok)=>{const e=$('#cfgStatus');e.textContent=m;e.className='status '+(ok?'ok':'bad')};
  $('#push').onclick=async()=>{read();if(!C.token)return st(T('needToken'));const was=!!C.gist;st(T('busy'),1);
    const r=await push();if(r===true){$('#gist').value=C.gist;$('#push').textContent=T('save');st(was?T('saved'):T('created'),1)}else st(r)};
  $('#pull').onclick=async()=>{read();if(!C.token)return st(T('needToken'));if(!C.gist)return st(T('needGist'));st(T('busy'),1);
    const r=await pull(true);st(r===true?T('loaded'):r,r===true)};
  $('#cfg').showModal();
};
const gh=(p,o={})=>fetch('https://api.github.com'+p,{...o,headers:{Authorization:'Bearer '+C.token,Accept:'application/vnd.github+json'}});
let t;function scheduleSync(){if(!C.token||!C.gist)return;clearTimeout(t);$('#syncState').textContent='…';t=setTimeout(push,1200)}
function errMsg(e){return e===401||e===403?T('badToken'):e===404?T('notFound'):typeof e==='number'?T('err')+' '+e:T('offline')}
async function push(){
  if(!C.token)return T('needToken');
  try{
    const body=JSON.stringify({description:'Напалам',public:false,files:{[FILE]:{content:JSON.stringify(S)}}});
    const r=C.gist?await gh('/gists/'+C.gist,{method:'PATCH',body}):await gh('/gists',{method:'POST',body});
    if(!r.ok)throw r.status;const j=await r.json();if(!C.gist){C.gist=j.id;ls.set(CFG,C)}
    $('#syncState').textContent=T('synced');return true;
  }catch(e){$('#syncState').textContent=T('noSync');return errMsg(e)}
}
async function pull(force){
  if(!C.token||!C.gist)return;
  try{
    const r=await gh('/gists/'+C.gist+'?t='+Date.now());if(!r.ok)throw r.status;
    const f=(await r.json()).files[FILE];if(!f)throw 404;
    const d=ensure(normalize(JSON.parse(f.truncated?await (await fetch(f.raw_url)).text():f.content)));
    if(force||d.updated>=(S.updated||0)){S=d;ls.set(KEY,S);render()}else push();
    $('#syncState').textContent=T('synced');return true;
  }catch(e){$('#syncState').textContent=T('noSync');return errMsg(e)}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

render();pull();
</script>
</body>
</html>
