<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дамавік</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#2b2622; --muted:#8a8077; --line:#e7e0d6;
  --a:#e07a5f; --b:#5b8e7d; --both:#9a7fc4; --rot:#d4a24c;
  --warn:#d9534f; --soon:#e0a03a; --ok:#6aa36f; --chip:#efe9e0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a18; --card:#262321; --ink:#efe9e2; --muted:#9a9088; --line:#36312d; --chip:#302c29;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a18; --card:#262321; --ink:#efe9e2; --muted:#9a9088; --line:#36312d; --chip:#302c29;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:22px;margin:0;flex:1}
.sync{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.spacer{flex:1}
.zone{margin:18px 0 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.task .main{flex:1;min-width:0}
.task .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.due-over{color:var(--warn);font-weight:600}
.due-soon{color:var(--soon);font-weight:600}
.due-ok{color:var(--ok)}
.pill{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.done{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;font-size:17px;flex:none}
.done:hover{border-color:var(--ok);color:var(--ok)}
.done.flash{background:var(--ok);border-color:var(--ok);color:#fff}
.edit{border:0;background:none;color:var(--muted);font-size:18px;padding:4px;flex:none}
.dots{letter-spacing:1px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--chip)}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:width .3s}
.legend{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.log{font-size:13px;max-height:260px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log span:last-child{margin-left:auto;color:var(--muted);white-space:nowrap}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:60px;resize:vertical}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;border:1px solid var(--line);background:var(--bg);padding:7px 9px;border-radius:9px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:10px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.del{color:var(--warn)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
dialog{border:0;border-radius:18px;padding:18px;width:min(460px,calc(100vw - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0;font-size:18px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;gap:8px;align-items:center}
.color input[type=color]{width:38px;height:38px;border:0;background:none;padding:0}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.lang{display:flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px}.lang button{border:0;background:none;padding:3px 7px;border-radius:6px;font-size:12px;color:var(--muted)}.lang button.on{background:var(--card);color:var(--ink);font-weight:700}

.tabs button{padding:8px 4px;font-size:14px}
.verdict{text-align:center;font-weight:700;font-size:15px}
#scaleSvg{width:100%;max-width:520px;display:block;margin:4px auto 0;overflow:visible}
#scaleSvg .frame line{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
#scaleSvg .frame line.beam{stroke:var(--ink);stroke-width:5}
#scaleSvg .pivot{fill:var(--ink)}
#scaleSvg .bowl{fill:var(--chip);stroke:var(--muted);stroke-width:2}
.scales{padding-bottom:52px}
.pans{display:grid;align-items:start;margin-top:-6px!important;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
.pan{background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:8px;min-height:90px;transition:transform .05s linear,border-color .15s,background .15s}
.panHead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
.panSub{font-size:11px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:5px 8px;font-size:13px;cursor:grab;user-select:none;touch-action:none;display:flex;gap:6px;align-items:center;max-width:100%}
.tchip b{font-size:11px;color:var(--muted);font-weight:700}
.tchip.dragging{opacity:.3}
.tchip.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-3deg);cursor:grabbing}
.pool{border-style:dashed;border-width:2px}
[data-drop].over{border-color:var(--ink)!important;background:var(--chip)}
.dropHint{font-size:12px;color:var(--muted);padding:6px 2px}
.quick{display:flex;gap:6px;margin-bottom:10px}
.quick input{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 <span id="appName">Дамавік</span></h1>
    <span class="sync" id="syncState"></span>
    <div class="lang"><button data-lang="be">BE</button><button data-lang="uk">UK</button></div>
  </header>
  <div class="tabs">
    <button data-tab="tasks" class="on"></button>
    <button data-tab="scales"></button>
    <button data-tab="balance"></button>
    <button data-tab="settings"></button>
  </div>
  <section id="tab-tasks"></section>
  <section id="tab-scales" hidden></section>
  <section id="tab-balance" hidden></section>
  <section id="tab-settings" hidden></section>
</div>
<button class="fab" id="addBtn">+</button>
<div class="toast" id="toast"></div>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

<script>
/* ---------- i18n ---------- */

/* seed zones & tasks in both languages; untouched seed items follow the current language */
const SEED_ZONES={
  kitchen:{be:'🍳 Кухня',uk:'🍳 Кухня'},bath:{be:'🛁 Ванная',uk:'🛁 Ванна'},rooms:{be:'🛋 Пакоі',uk:'🛋 Кімнати'},

};
const SEED_TASKS={
  dishes:{be:'Памыць посуд / пасудамыйка',uk:'Помити посуд / посудомийка'},
  stove:{be:'Выцерці стол і пліту',uk:'Протерти стіл і плиту'},
  trash:{be:'Вынесці смецце',uk:'Винести сміття'},
  fridge:{be:'Разабраць халадзільнік',uk:'Розібрати холодильник'},

  wc:{be:'Памыць унітаз',uk:'Помити унітаз'},
  towels:{be:'Змяніць ручнікі',uk:'Змінити рушники'},

  groceries:{be:'Закупка прадуктаў',uk:'Закупівля продуктів'},
  bills:{be:'Аплаціць рахункі',uk:'Оплатити рахунки'},
  plants:{be:'Паліць кветкі',uk:'Полити квіти'}
};

const FREQ={daily:{days:1,w:7},every3:{days:3,w:2.5},weekly:{days:7,w:1},biweekly:{days:14,w:.5},monthly:{days:30,w:.25},asneeded:{days:0,w:.5}};
const STORE_KEY='domovik-v1', CFG_KEY='domovik-cfg', GIST_FILE='domovik.json';
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=864e5;

const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let C=Object.assign({me:'a',token:'',gist:'',theme:'auto',lang:(navigator.language||'').startsWith('uk')?'uk':'be'},ls.get(CFG_KEY)||{});
const T=(k,v={})=>(I18N[C.lang][k]??I18N.be[k]??k).replace(/\{(\w+)\}/g,(_,m)=>v[m]??'');
const fl=k=>T('f_'+k);

/* zone display: a seed zone name in either language shows in the current one */
function zl(z){for(const v of Object.values(SEED_ZONES))if(v.be===z||v.uk===z)return v[C.lang];return z}
const tt=t=>t.sk&&SEED_TASKS[t.sk]?SEED_TASKS[t.sk][C.lang]:t.title;

function seed(){
  const Z=k=>SEED_ZONES[k][C.lang];
  const t=(sk,zone,owner,freq,effort)=>({id:uid(),sk,title:SEED_TASKS[sk][C.lang],zone:Z(zone),owner,next:'a',freq,effort,lastDone:null,lastBy:null,note:''});
  return {
    people:{a:{name:'Уладзь',color:'#e07a5f'},b:{name:T('defB'),color:'#5b8e7d'}},
    zones:Object.keys(SEED_ZONES).map(Z),
    tasks:[
      t('dishes','kitchen','rotate','daily',1),t('stove','kitchen','rotate','daily',1),t('trash','kitchen','a','every3',1),t('fridge','kitchen','b','monthly',2),

      t('vacuum','rooms','a','weekly',2),t('floor','rooms','rotate','biweekly',3),t('dust','rooms','b','biweekly',1),t('bedding','rooms','both','biweekly',2),
      t('wash','laundry','b','weekly',1),t('fold','laundry','a','weekly',2),
      t('groceries','shop','both','weekly',2),t('bills','shop','a','monthly',1),
      t('plants','misc','b','every3',1)
    ],
    log:[],updated:Date.now()

function ownerInfo(o,task){
  const P=S.people;
  if(o==='a'||o==='b')return{label:P[o].name,color:P[o].color};
  if(o==='both')return{label:T('both'),color:'var(--both)'};
  if(o==='none')return{label:T('nobody'),color:'var(--muted)'};
  return{label:'🔄 '+P[task?.next||'a'].name,color:'var(--rot)'};
}
function ago(ts){const d=Math.floor((Date.now()-ts)/DAY);return d<=0?T('today'):d===1?T('yesterday'):T('daysAgo',{n:d})}
function dueInfo(t){
  const f=FREQ[t.freq];
  if(!f.days)return{txt:t.lastDone?T('lastTime',{x:ago(t.lastDone)}):T('asNeeded'),cls:'',score:9999};
  if(!t.lastDone)return{txt:T('never'),cls:'due-soon',score:-1};
  const left=Math.round((t.lastDone+f.days*DAY-Date.now())/DAY);
  if(left<0)return{txt:T('overdue',{n:-left}),cls:'due-over',score:left};
  if(left===0)return{txt:T('today'),cls:'due-soon',score:0};
  if(left===1)return{txt:T('tomorrow'),cls:'due-soon',score:1};
  return{txt:T('inDays',{n:left}),cls:'due-ok',score:left};
}

/* ---------- scales ---------- */
function tw(t){return FREQ[t.freq].w*t.effort}
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
let scaleAngle=0, scaleAnim=null;
function drawBeam(a){
  const svg=$('#scaleSvg');if(!svg)return;
  const r=a*Math.PI/180, L=118, cx=150, cy=44, dx=L*Math.cos(r), dy=L*Math.sin(r);
  const lx=cx-dx, ly=cy-dy, rx=cx+dx, ry=cy+dy, s=34;
  const bowl=(x,y)=>`<line x1="${x}" y1="${y}" x2="${x-26}" y2="${y+s}"/><line x1="${x}" y1="${y}" x2="${x+26}" y2="${y+s}"/><path d="M${x-34} ${y+s} Q${x} ${y+s+18} ${x+34} ${y+s}Z" class="bowl"/>`;
  svg.innerHTML=`<g class="frame"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="132"/><line x1="${cx-34}" y1="132" x2="${cx+34}" y2="132"/>
    <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" class="beam"/><circle cx="${cx}" cy="${cy}" r="5" class="pivot"/>
    ${bowl(lx,ly)}${bowl(rx,ry)}</g>`;
  const k=svg.getBoundingClientRect().width/300||1;
  const pa=$('#panA'),pb=$('#panB');
  if(pa)pa.style.transform=`translateY(${(-dy)*k}px)`;
  if(pb)pb.style.transform=`translateY(${dy*k}px)`;
}
function animateBeam(to){
  cancelAnimationFrame(scaleAnim);
  const from=scaleAngle,t0=performance.now(),D=600;
  const step=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);scaleAngle=from+(to-from)*e;drawBeam(scaleAngle);if(p<1)scaleAnim=requestAnimationFrame(step)};
  scaleAnim=requestAnimationFrame(step);
}
function chipHTML(t){
  const col=t.owner==='a'||t.owner==='b'?S.people[t.owner].color:t.owner==='none'?'var(--line)':'var(--both)';
  return `<div class="tchip" data-tid="${t.id}" style="border-left-color:${col}">${t.owner==='rotate'?'🔄 ':''}${esc(tt(t))}<b>${fmt(tw(t))}</b></div>`;
}
function renderScales(){
  const P=S.people,L=load();
  const own=k=>S.tasks.filter(t=>t.owner===k);
  const shared=S.tasks.filter(t=>t.owner==='both'||t.owner==='rotate');
  const sh=shared.reduce((s,t)=>s+tw(t),0)/2;
  const tot=L.a+L.b, diff=L.a-L.b;
  const target=tot?Math.max(-16,Math.min(16,(L.b-L.a)/tot*40)):0;
  let verdict=T('balanced');
  if(tot&&Math.abs(diff)/tot>0.05)verdict=T('heavier',{x:diff>0?P.a.name:P.b.name,d:fmt(Math.abs(diff))})+` · ${Math.round(L.a/tot*100)}% / ${Math.round(L.b/tot*100)}%`;
  const pan=(k,id)=>`<div class="pan" id="${id}" data-drop="${k}">
      <div class="panHead"><span style="color:${P[k].color}">${esc(P[k].name)}</span><b>${fmt(L[k])}</b></div>
      ${sh?`<div class="panSub">${T('inclShared',{s:fmt(sh)})}</div>`:''}
      <div class="chips">${own(k).map(chipHTML).join('')||`<div class="dropHint">${T('dropHere')}</div>`}</div></div>`;
  $('#tab-scales').innerHTML=`
    <div class="card scales">
      <div class="verdict">${esc(verdict)}</div>
      <svg id="scaleSvg" viewBox="0 0 300 136" aria-hidden="true"></svg>
      <div class="pans">${pan('a','panA')}${pan('b','panB')}</div>
    </div>
    <div class="card pool" data-drop="both"><h3>${T('sharedPool')}</h3>
      <div class="chips">${shared.map(chipHTML).join('')||`<div class="dropHint">${T('dropHere')}</div>`}</div></div>
    <div class="card pool basket" data-drop="none"><h3>${T('basket')}</h3>
      <form id="quickAdd" class="quick"><input type="text" name="q" placeholder="${T('quickPh')}" autocomplete="off"><button class="btn pri">${T('addShort')}</button></form>
      <div class="chips">${own('none').map(chipHTML).join('')||`<div class="dropHint">${T('dropHere')}</div>`}</div></div>
    <div class="hint">${T('scalesHint')}</div>`;
  drawBeam(scaleAngle);
  animateBeam(target);
  $('#quickAdd').onsubmit=e=>{e.preventDefault();const v=e.target.q.value.trim();if(!v)return;
    S.tasks.push({id:uid(),title:v,zone:S.zones[S.zones.length-1]||'',owner:'none',next:C.me,freq:'weekly',effort:1,lastDone:null,lastBy:null,note:''});save();
    setTimeout(()=>$('#quickAdd input')?.focus(),0)};
}
window.addEventListener('resize',()=>{if(UI.tab==='scales')drawBeam(scaleAngle)});

/* pointer drag for chips (works with mouse and touch) */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.tchip');if(!c||e.button>0)return;
  e.preventDefault();
  drag={id:c.dataset.tid,el:c,x:e.clientX,y:e.clientY,moved:false,ghost:null,over:null};
  c.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  if(!drag.moved){
    drag.moved=true;const r=drag.el.getBoundingClientRect();
    drag.ghost=drag.el.cloneNode(true);drag.ghost.classList.add('ghost');drag.ghost.style.width=r.width+'px';
    drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;document.body.appendChild(drag.ghost);drag.el.classList.add('dragging');
  }
  const edge=60;if(e.clientY<edge)window.scrollBy(0,-12);else if(e.clientY>innerHeight-edge)window.scrollBy(0,12);
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');
  if(under!==drag.over){drag.over?.classList.remove('over');under?.classList.add('over');drag.over=under}
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  d.ghost?.remove();d.el.classList.remove('dragging');d.over?.classList.remove('over');
  if(cancel)return;
  if(!d.moved){openTask(d.id);return}
  if(!d.over)return;
  const t=S.tasks.find(x=>x.id===d.id);const k=d.over.dataset.drop;
  const nk=k==='both'?(t.owner==='rotate'||t.owner==='both'?t.owner:'both'):k;
  if(nk!==t.owner){t.owner=nk;save()}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

  f.querySelectorAll('[data-seg]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');st[g.dataset.seg]=g.dataset.seg==='effort'?+b.dataset.v:b.dataset.v});

/* ---------- actions ---------- */
function markDone(id,btn){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const by=C.me;
  t.lastDone=Date.now();t.lastBy=by;
  if(t.owner==='rotate')t.next=by==='a'?'b':'a';
  S.log.push({taskId:id,by,ts:t.lastDone});
  if(S.log.length>500)S.log=S.log.slice(-500);
  btn.classList.add('flash');
  toast(T('wellDone',{x:S.people[by].name}));
  setTimeout(save,350);
}
function cycleOwner(id){
  const order=['a','b','both','rotate'];const t=S.tasks.find(x=>x.id===id);
  t.owner=order[(order.indexOf(t.owner)+1)%order.length];save();
}
function saveZones(){
  const nz=$('#zones').value.split('\n').map(s=>s.trim()).filter(Boolean);
  S.tasks.forEach(t=>{const m=nz.find(z=>z===t.zone||z===zl(t.zone));if(m)t.zone=m});

}

/* ---------- gist sync ---------- */
function readGistCfg(){C.token=$('#token').value.trim();C.gist=$('#gist').value.trim();ls.set(CFG_KEY,C)}
function setSync(t){$('#syncState').textContent=t}
const gh=(path,opt={})=>fetch('https://api.github.com'+path,{...opt,headers:{'Authorization':'Bearer '+C.token,'Accept':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});
let syncT=null;
function scheduleSync(){if(!C.token||!C.gist)return;clearTimeout(syncT);setSync('…');syncT=setTimeout(()=>pushGist(false),1500)}
async function pushGist(manual){
  if(!C.token){toast(T('needToken'));return}
  try{
    const body=JSON.stringify({description:'Дамавік / Домовик',public:false,files:{[GIST_FILE]:{content:JSON.stringify(S)}}});
    const r=C.gist?await gh('/gists/'+C.gist,{method:'PATCH',body}):await gh('/gists',{method:'POST',body});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(!C.gist){C.gist=j.id;ls.set(CFG_KEY,C);if(UI.tab==='settings')render()}
    setSync(T('synced'));if(manual)toast(T('savedGist'));
  }catch(err){setSync(T('noSync'));if(manual)toast(T('gistErr')+err.message)}
}
async function pullGist(manual){
  if(!C.token||!C.gist)return;
  try{
    setSync('…');
    const r=await gh('/gists/'+C.gist+'?t='+Date.now());if(!r.ok)throw new Error(r.status);
    const j=await r.json();const f=j.files[GIST_FILE];if(!f)throw new Error(T('noFile'));
    const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;
    const d=JSON.parse(txt);
    if(manual||!S.updated||d.updated>=S.updated){S=d;ls.set(STORE_KEY,S);render()}
    else pushGist(false);
    setSync(T('synced'));if(manual)toast(T('loaded'));
  }catch(err){setSync(T('noSync'));if(manual)toast(T('gistErr')+err.message)}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullGist(false)});

applyTheme();render();pullGist(false);
setInterval(render,60000);
</script>
</body>
</html>
